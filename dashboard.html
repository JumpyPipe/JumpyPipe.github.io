<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Options Dashboard Demo | Akash</title>
  <meta name="description" content="Interactive demo of an options and portfolio activity dashboard. All data is synthetic.">
  <style>
    :root { color-scheme: light; --bg: #F7F7F9; }
    html, body { height: 100%; }
    body { margin: 0; background: var(--bg); -webkit-font-smoothing: antialiased;
      font: 14px -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: #141413; }
    #root { min-height: 100%; }
    .demo-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
      padding: 10px 20px; background: #E8F0FE; color: #0B2F5E; font-size: 13px; line-height: 1.4; }
    .demo-bar a { color: #0A63D6; font-weight: 600; text-decoration: none; white-space: nowrap; }
    .demo-bar a:hover { text-decoration: underline; }
    #boot-fallback { display: flex; align-items: center; justify-content: center; min-height: 60vh; color: #667085; }
  </style>
</head>
<body>
  <div class="demo-bar">
    <span><strong>Demo.</strong> Everything here is synthetic sample data, not real accounts or trades. Explore the tabs, filters, and charts.</span>
    <a href="index.html">Back to portfolio</a>
  </div>
  <div id="root"><div id="boot-fallback">Loading dashboard…</div></div>
  <script src="dashboard-app.js"></script>
</body>
</html>
